name: Telegram market alerts

# Three dispatches a day aligned to session opens (UTC). Offset minutes avoid
# GitHub's top-of-hour scheduling queue, which can delay jobs 15+ minutes.
on:
  schedule:
    - cron: '7 7 * * 1-5'    # London open
    - cron: '7 13 * * 1-5'   # New York open
    - cron: '7 21 * * 0-4'   # Asia open
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch board to Telegram
        env:
          SECRET: ${{ secrets.ALERT_SECRET || 'fj_alert_9f3c2b7d41' }}
        run: |
          code=$(curl -s -o /tmp/a.json -w '%{http_code}' --max-time 90 \
            "https://fjinstitutional.techoracle0.workers.dev/api/alert?key=$SECRET")
          echo "alert HTTP $code"
          cat /tmp/a.json
          test "$code" = "200"
