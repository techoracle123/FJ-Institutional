name: Thesis tracker

# The platform's heartbeat. Workers cannot do this (10ms CPU, no state, only
# wakes on requests). Actions is free and unlimited on public repos.
# Offset minutes avoid GitHub's peak-of-hour cron congestion.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Poll and update ledger
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/track.mjs

      - name: Commit ledger
        run: |
          git config user.name "FJ Institutional Bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet data/ledger.json 2>/dev/null; then
            echo "No ledger change."
            exit 0
          fi
          git add data/ledger.json
          git commit -m "chore(ledger): tracker update [skip ci]"
          # Tracker runs every 5 min; a racing commit is normal, so rebase.
          # data/ledger.json is written wholesale by this job and owned by no
          # one else, so on conflict the freshly-computed file always wins --
          # a textual merge of a serialised ledger is never meaningful. Without
          # this the rebase halts on a conflict and every later run fails.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              git push && exit 0
            else
              if [ -n "$(git ls-files -u data/ledger.json)" ]; then
                git checkout --ours data/ledger.json || git checkout HEAD -- data/ledger.json
                git add data/ledger.json
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              else
                git rebase --abort 2>/dev/null || true
              fi
            fi
            sleep 5
          done
          exit 1
