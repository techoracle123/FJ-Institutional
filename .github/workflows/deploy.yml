# Deploy to Cloudflare Workers from CI.
#
# Previously every deploy ran from a local machine with a personal API token.
# That token expired and the platform silently froze on an old build while the
# repo moved ahead. CI deploys remove that single point of failure: rotate the
# CLOUDFLARE_API_TOKEN secret and everything keeps shipping.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'          # bot-written ledger/fred commits must not redeploy
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build worker
        run: npx opennextjs-cloudflare build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the deploy is live and serving setups
        run: |
          sleep 20
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/state.json -w "%{http_code}" https://fjinstitutional.techoracle0.workers.dev/api/state)
            if [ "$code" = "200" ]; then
              python3 -c "import json;d=json.load(open('/tmp/state.json'));print('ok',d.get('ok'),'conf',d.get('dataConfidence'),'theses',len(d.get('theses',[])),'setups',len(d.get('setups') or []))"
              exit 0
            fi
            sleep 10
          done
          echo 'site did not come back healthy'
          exit 1
